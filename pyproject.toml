[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genomic-causal-inference"
version = "1.0.0"
description = "Causal inference pipeline for genomic data: VCF genotypes → height prediction with ML and causal methods."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Alex Jarrahi", email = "alexajarrahi@gmail.com"},
]
keywords = ["genomics", "causal-inference", "mendelian-randomization", "GWAS", "machine-learning", "SNP"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "scipy>=1.8",
    "scikit-learn>=1.1",
    "matplotlib>=3.5",
    "openpyxl>=3.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dowhy = ["dowhy>=0.9"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "dowhy>=0.9",
]

[project.scripts]
genomic-causal = "genomic_causal.pipeline:main"

[project.urls]
Homepage = "https://github.com/Amin-Jarrahi/genomic-causal-inference"
Repository = "https://github.com/Amin-Jarrahi/genomic-causal-inference"
Issues = "https://github.com/Amin-Jarrahi/genomic-causal-inference/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
